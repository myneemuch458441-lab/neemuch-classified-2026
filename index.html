    <script>
      // Ignore WebSocket / HMR connection errors in preview iframe per environment constraints
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e.reason &&
          (String(e.reason).includes('WebSocket') ||
           String(e.reason.message || '').includes('WebSocket') ||
           String(e.reason.stack || '').includes('@vite/client') ||
           String(e.reason.stack || '').includes('createWebSocketModuleRunnerTransport'))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        if (
          (e.message && e.message.includes('WebSocket')) ||
          (e.filename && e.filename.includes('@vite/client'))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
